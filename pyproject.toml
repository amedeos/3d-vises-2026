[project]
name = "tux-vises"
version = "0.1.0"
description = "Tux Clip and Tux Vise: two Tux-themed holding tools (Printables Designer Challenge: Vises)"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "bd_warehouse>=0.4.0",
    "build123d>=0.13.0",
    "numpy>=2",
    "pillow>=13.0.0",
    "trimesh>=5.2.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["common", "tux_clip"]

[dependency-groups]
dev = [
    "networkx>=3.7",
    "pytest>=9.1.1",
    "rtree>=1.4.1",
    "scipy>=1.18",
    "shapely>=2.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
